[project]
name = "zotero-plus"
version = "0.1.0"
description = "Local-first Zotero automation for collections, attachments, and cached PDF text extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.25.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
zotero-plus = "zotero_plus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
